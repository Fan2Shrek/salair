version: '3.8'

services:
    frontend:
        platform: linux/amd64
        image: registry.nassimlounadi.fr/nassimlnd/salair-frontend:latest
        restart: always
        environment:
            NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL}
        networks:
            - app_network
        ports:
            - "3298:3000"
        depends_on:
            - backend

    backend:
        platform: linux/amd64
        image: registry.nassimlounadi.fr/nassimlnd/salair-backend:latest
        restart: always
        ports:
            - "3299:3333"
        environment:
            DB_HOST: ${DB_HOST}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_DATABASE: ${DB_DATABASE}
            DB_PORT: ${DB_PORT}
            HOST: ${HOST}
            TZ: ${TZ}
            PORT: ${PORT}
            LOG_LEVEL: ${LOG_LEVEL}
            APP_KEY: ${APP_KEY}
            NODE_ENV: ${NODE_ENV}
            SESSION_DRIVER: ${SESSION_DRIVER}
        networks:
            - app_network
        depends_on:
            - db

    db:
        image: postgres:17
        restart: always
        volumes:
            - db_data:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        networks:
            - app_network

    storage:
        image: minio/minio
        ports:
            - '9000:9000'
            - '8900:8900'
        environment:
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: password
        volumes:
            - 'minio:/data/minio'
        command: 'minio server /data/minio --console-address ":8900"'
        healthcheck:
            test:
                - CMD
                - curl
                - '-f'
                - 'http://localhost:9000/minio/health/live'
            retries: 3
            timeout: 5s
            
networks:
    app_network:
        driver: bridge

volumes:
    db_data:
    minio:
        driver: local
