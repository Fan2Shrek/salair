version: '3.8'

services:
    frontend:
        platform: linux/amd64
        image: registry.nassimlounadi.fr/nassimlnd/salair-frontend:latest
        restart: always
        environment:
            NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL}
        networks:
            - app_network
        ports:
            - "3298:3000"
        depends_on:
            - backend

    backend:
        platform: linux/amd64
        image: registry.nassimlounadi.fr/nassimlnd/salair-backend:latest
        restart: always
        ports:
            - "3299:3333"
        environment:
            DB_HOST: ${DB_HOST}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_DATABASE: ${DB_DATABASE}
            DB_PORT: ${DB_PORT}
            HOST: ${HOST}
            TZ: ${TZ}
            PORT: ${PORT}
            LOG_LEVEL: ${LOG_LEVEL}
            APP_KEY: ${APP_KEY}
            NODE_ENV: ${NODE_ENV}
            SESSION_DRIVER: ${SESSION_DRIVER}
        networks:
            - app_network
        depends_on:
            - db

    db:
        image: postgres:17
        restart: always
        volumes:
            - db_data:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        networks:
            - app_network

networks:
    app_network:
        driver: bridge

volumes:
    db_data:
