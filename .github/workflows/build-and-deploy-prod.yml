name: Build and deploy (PROD)

on:
  push:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_frontend:
    name: Build and push frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v2
        with:
          registry: registry.nassimlounadi.fr
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.nassimlounadi.fr/nassimlnd/salair-frontend:latest
          target: prod
          cache-from: type=registry,ref=registry.nassimlounadi.fr/nassimlnd/salair-frontend:buildcache
          cache-to: type=registry,ref=registry.nassimlounadi.fr/nassimlnd/salair-frontend:buildcache,mode=max

  build_backend:
    name: Build and push backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v2
        with:
          registry: registry.nassimlounadi.fr
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v4
        with:
          context: ./backend/
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.nassimlounadi.fr/nassimlnd/salair-backend:latest
          target: prod
          cache-from: type=registry,ref=registry.nassimlounadi.fr/nassimlnd/salair-backend:buildcache
          cache-to: type=registry,ref=registry.nassimlounadi.fr/nassimlnd/salair-backend:buildcache,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]

    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          scp docker-compose.prod.yml $SSH_USER@$SSH_HOST:~/www/salair/docker-compose.yml
          ssh $SSH_USER@$SSH_HOST << 'EOF'
            cd ~/www/salair/
            docker compose pull
            docker compose up -d
            docker image prune -f
          EOF
