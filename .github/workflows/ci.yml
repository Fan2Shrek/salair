name: CI - Build and Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - name: Frontend build check
              run: |
                  cd frontend
                  npm install
                  npm run build

            - name: Backend build check
              run: |
                  cd backend
                  npm install
                  npm run build
