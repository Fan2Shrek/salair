name: Deploy tagged version (Swarm)

on:
    workflow_call:
        inputs:
            tag:
                required: true
                type: string

env:
    REGISTRY: registry.nassimlounadi.fr
    IMAGE_TAG: ${{ inputs.tag }}

jobs:
    build_frontend:
        name: 'Build and push frontend'
        runs-on: ubuntu-latest
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - uses: actions/checkout@v3

            - uses: docker/setup-buildx-action@v2

            - uses: docker/login-action@v2
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - uses: docker/build-push-action@v4
              id: build
              with:
                  context: ./frontend/
                  file: ./frontend/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ env.REGISTRY }}/nassimlnd/salair-frontend:${{ env.IMAGE_TAG }}
                  target: prod
                  cache-from: type=registry,ref=${{ env.REGISTRY }}/nassimlnd/salair-frontend:buildcache
                  cache-to: type=registry,ref=${{ env.REGISTRY }}/nassimlnd/salair-frontend:buildcache,mode=max

    build_backend:
        name: 'Build and push backend'
        runs-on: ubuntu-latest
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - uses: actions/checkout@v3

            - uses: docker/setup-buildx-action@v2

            - uses: docker/login-action@v2
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - uses: docker/build-push-action@v4
              id: build
              with:
                  context: ./backend/
                  file: ./backend/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ env.REGISTRY }}/nassimlnd/salair-backend:${{ env.IMAGE_TAG }}
                  target: prod
                  cache-from: type=registry,ref=${{ env.REGISTRY }}/nassimlnd/salair-backend:buildcache
                  cache-to: type=registry,ref=${{ env.REGISTRY }}/nassimlnd/salair-backend:buildcache,mode=max

    deploy:
        name: 'Deploy to VPS with Compose'
        runs-on: ubuntu-latest
        needs: [build_frontend, build_backend]
        steps:
            - uses: actions/checkout@v4

            - uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

            - name: Upload docker-compose.prod.yml
              env:
                  SSH_HOST: ${{ secrets.VPS_HOST }}
                  SSH_USER: ${{ secrets.VPS_USER }}
              run: |
                  echo "StrictHostKeyChecking no" >> ~/.ssh/config
                  scp docker-compose.prod.yml $SSH_USER@$SSH_HOST:~/www/salair/docker-compose.prod.yml

            - name: Inject digests and deploy with Docker Compose
              env:
                  SSH_HOST: ${{ secrets.VPS_HOST }}
                  SSH_USER: ${{ secrets.VPS_USER }}
                  FRONTEND_DIGEST: registry.nassimlounadi.fr/nassimlnd/salair-frontend@${{ needs.build_frontend.outputs.digest }}
                  BACKEND_DIGEST: registry.nassimlounadi.fr/nassimlnd/salair-backend@${{ needs.build_backend.outputs.digest }}
              run: |
                  echo "StrictHostKeyChecking no" >> ~/.ssh/config
                  ssh $SSH_USER@$SSH_HOST << EOF
                    cd ~/www/salair/

                    sed -i "s|registry.nassimlounadi.fr/nassimlnd/salair-frontend:.*|$FRONTEND_DIGEST|" docker-compose.prod.yml
                    sed -i "s|registry.nassimlounadi.fr/nassimlnd/salair-backend:.*|$BACKEND_DIGEST|" docker-compose.prod.yml

                    docker compose -f docker-compose.prod.yml --env-file .env pull
                    docker compose -f docker-compose.prod.yml --env-file .env up -d
                    docker image prune -f
                  EOF
