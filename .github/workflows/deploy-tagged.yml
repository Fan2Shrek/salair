name: Deploy tagged version (Swarm)

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  REGISTRY: registry.nassimlounadi.fr
  IMAGE_TAG: ${{ inputs.tag }}

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/nassimlnd/salair-frontend:${{ env.IMAGE_TAG }}
          target: prod
          cache-from: type=registry,ref=${{ env.REGISTRY }}/nassimlnd/salair-frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/nassimlnd/salair-frontend:buildcache,mode=max

  build_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v4
        with:
          context: ./backend/
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/nassimlnd/salair-backend:${{ env.IMAGE_TAG }}
          target: prod
          cache-from: type=registry,ref=${{ env.REGISTRY }}/nassimlnd/salair-backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/nassimlnd/salair-backend:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to Docker Swarm
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          ssh $SSH_USER@$SSH_HOST << EOF
            cd ~/www/salair/

            sed -i "s/salair-frontend:.*/salair-frontend:\$IMAGE_TAG/" docker-stack.yml
            sed -i "s/salair-backend:.*/salair-backend:\$IMAGE_TAG/" docker-stack.yml

            docker stack deploy -c docker-stack.yml salair
            docker image prune -f
          EOF
