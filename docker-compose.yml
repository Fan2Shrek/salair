services:
    db:
        image: postgres:17
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        ports:
            - "5432:5432"

    web:
        build:
            context: frontend
            dockerfile: Dockerfile
            target: dev
        ports:
            - "3000:3000"

    api:
        build:
            context: backend
            dockerfile: Dockerfile
            target: main
        ports:
            - "3333:3333"
        depends_on:
            - db
        environment:
            DB_HOST: ${DB_HOST}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_DATABASE: ${DB_DATABASE}
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3333/api/health"]
            interval: 1m30s
            timeout: 30s
            retries: 5
            start_period: 30s

    storage:
        image: minio/minio
        ports:
            - '9000:9000'
            - '8900:8900'
        environment:
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: password
        volumes:
            - 'minio:/data/minio'
        command: 'minio server /data/minio --console-address ":8900"'
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            retries: 3
            timeout: 5s

volumes:
    minio:
        driver: local

