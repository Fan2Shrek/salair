services:
    db:
        image: postgres:17
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        ports:
            - "5432:5432"

    web:
        build:
            context: frontend
            dockerfile: Dockerfile
            target: dev
        ports:
            - "3000:3000"

    api:
        build:
            context: backend
            dockerfile: Dockerfile
            target: main
        ports:
            - "3333:3333"
        depends_on:
            - db
        environment:
            DB_HOST: ${DB_HOST}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_DATABASE: ${DB_DATABASE}
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3333/api/health"]
            interval: 1m30s
            timeout: 30s
            retries: 5
            start_period: 30s

